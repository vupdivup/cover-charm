# Publishes site/ to GitHub Pages. Branch-based Pages can only serve the
# repo root or /docs, and the showcase lives in site/, so it's uploaded
# as an artifact instead -- no build step, just the directory as-is.
#
# The page reads its album list from the CDN at runtime, so a release
# (an `assets` merge) needs no run here; only changes to site/ do.
name: pages

on:
  push:
    branches: [master]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a queued
# run can't drop the newest site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
