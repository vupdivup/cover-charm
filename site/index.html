<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cover Charm</title>
  <meta name="description" content="Browse rendered album cover animations and copy an embeddable snippet." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    // Runs before paint so the stored/system theme applies with no flash.
    (function () {
      var stored = localStorage.getItem("theme");
      var theme = stored === "light" || stored === "dark"
        ? stored
        : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = theme;
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="site-header__title">
      <h1>Cover Charm</h1>
      <p id="count" class="muted">Loading…</p>
    </div>
    <div class="search">
      <svg class="search__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/>
      </svg>
      <input
        id="search"
        type="search"
        placeholder="Search artist or title…"
        autocomplete="off"
        aria-label="Search albums"
      />
    </div>
    <div class="header-actions">
      <button
        id="theme-toggle"
        class="icon-btn"
        type="button"
        aria-label="Toggle dark mode"
      >
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10m0-15a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1m0 18a1 1 0 0 1 1 1v1a1 1 0 1 1-2 0v-1a1 1 0 0 1 1-1M4.22 4.22a1 1 0 0 1 1.42 0l.7.7a1 1 0 1 1-1.42 1.42l-.7-.7a1 1 0 0 1 0-1.42m13.44 13.44a1 1 0 0 1 1.42 0l.7.7a1 1 0 0 1-1.42 1.42l-.7-.7a1 1 0 0 1 0-1.42M1 12a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2H2a1 1 0 0 1-1-1m18 0a1 1 0 0 1 1-1h1a1 1 0 1 1 0 2h-1a1 1 0 0 1-1-1M4.22 19.78a1 1 0 0 1 0-1.42l.7-.7a1 1 0 1 1 1.42 1.42l-.7.7a1 1 0 0 1-1.42 0M17.66 6.34a1 1 0 0 1 0-1.42l.7-.7a1 1 0 1 1 1.42 1.42l-.7.7a1 1 0 0 1-1.42 0"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <path fill="currentColor" d="M20.742 13.045a8.088 8.088 0 0 1-2.077.271c-4.492 0-8.131-3.639-8.131-8.131 0-1.386.348-2.69.96-3.831a10.05 10.05 0 0 0-8.842 9.968c0 5.554 4.502 10.056 10.056 10.056 4.85 0 8.901-3.435 9.847-8.005a8.006 8.006 0 0 1-1.813-.328"/>
        </svg>
      </button>
      <a
        class="icon-btn gh-link"
        href="https://github.com/vupdivup/cover-charm"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="View source on GitHub"
      >
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true">
          <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
        </svg>
      </a>
    </div>
  </header>

  <main>
    <p id="empty" hidden>No albums match your search.</p>
    <div id="grid" class="grid" aria-live="polite"></div>
  </main>

  <dialog id="detail" class="detail">
    <form method="dialog" class="detail__close-form">
      <button type="submit" class="detail__close" aria-label="Close">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
        </svg>
      </button>
    </form>
    <div class="detail__media">
      <img id="detail-img" alt="" />
    </div>
    <div class="detail__body">
      <h2 id="detail-title"></h2>
      <p id="detail-sub" class="muted"></p>

      <div class="snippet">
        <div class="snippet__tabs" role="tablist" aria-label="Snippet format">
          <button type="button" role="tab" data-format="markdown" aria-selected="true">Markdown</button>
          <button type="button" role="tab" data-format="html" aria-selected="false">HTML</button>
          <button type="button" role="tab" data-format="url" aria-selected="false">URL</button>
        </div>
        <div class="snippet__panel">
          <pre id="snippet-code"></pre>
          <button id="snippet-copy" type="button" class="copy-btn">Copy</button>
        </div>
      </div>
    </div>
  </dialog>

  <footer class="site-footer">
    <p>
      &copy; <span id="year"></span>
      <a href="https://github.com/vupdivup" target="_blank" rel="noopener noreferrer">vupdivup</a>.
      Source on <a href="https://github.com/vupdivup/cover-charm" target="_blank" rel="noopener noreferrer">GitHub</a>.
    </p>
    <p>
      Images served via <a href="https://www.jsdelivr.com/" target="_blank" rel="noopener noreferrer">jsDelivr</a>
      from the <code>assets-dev</code> branch.
      <span id="manifest-date"></span>
    </p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
