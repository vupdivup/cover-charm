<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!--
    Favicon: Phosphor Fill "eject" (MIT, phosphoricons.com), the
    same icon set as the page's <use> sheet, on a full-bleed block —
    square corners to match the design's zero radius. Fill weight rather
    than the Regular used in the UI: at 16px Regular's thin arcs break
    up, while one solid mass survives.

    Colours are the light theme's accent pair, fixed rather than
    following prefers-color-scheme: the tab strip is browser chrome, not
    the page, and the page's theme is a stored override an SVG favicon
    can't read anyway, so a responsive mark would contradict the UI
    whenever the two disagree. One constant identity instead — the
    accent as the ground, since at 16px colour is what makes a tab
    findable, not the glyph.
  -->
  <rect width="256" height="256" fill="#ff2d55"/>
  <g transform="translate(128 128) scale(0.78) translate(-128 -128)" fill="#ffffff">
    <path d="M33.31,126.24a15.59,15.59,0,0,1,3.1-17.12h0l73.73-77.51a24.76,24.76,0,0,1,35.72,0l73.73,77.51a15.59,15.59,0,0,1,3.1,17.12A16.18,16.18,0,0,1,207.76,136H48.24A16.18,16.18,0,0,1,33.31,126.24ZM208,152H48a16,16,0,0,0-16,16v16a16,16,0,0,0,16,16H208a16,16,0,0,0,16-16V168A16,16,0,0,0,208,152Z"/>
  </g>
</svg>
