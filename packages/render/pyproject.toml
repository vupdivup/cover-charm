[project]
name = "render"
version = "0.1.0"
description = "Render a Blender animation with a swapped-in image texture, and assemble it into a GIF"
readme = "src/render/README.md"
authors = [
    { name = "vupdivup", email = "vnmatt2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pillow>=12.3.0",
]

[project.scripts]
render = "render.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
