[project]
name = "album-store"
version = "0.1.0"
description = "Fetch and persist album cover art (Postgres metadata + MinIO/S3 objects)"
readme = "src/album_store/README.md"
authors = [
    { name = "vupdivup", email = "vnmatt2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "album-covers",
    "psycopg[binary]>=3.2",
    "boto3>=1.35",
]

[project.scripts]
album-store = "album_store.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
album-covers = { workspace = true }
