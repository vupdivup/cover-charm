[project]
name = "album-seed"
version = "0.1.0"
description = "Download a Kaggle album-ratings dataset and export the top albums by popularity"
readme = "src/album_seed/README.md"
authors = [
    { name = "vupdivup", email = "vnmatt2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "kagglehub>=0.3.13",
]

[project.scripts]
album-seed = "album_seed.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["packages/render", "packages/album-covers"]
