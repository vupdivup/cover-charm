[project]
name = "cover-art"
version = "0.1.0"
description = "Fetch album cover art from iTunes and normalize it to a square size"
readme = "README.md"
authors = [
    { name = "vupdivup", email = "vnmatt2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.83",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
]

[project.scripts]
cover-art = "cover_art.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"
