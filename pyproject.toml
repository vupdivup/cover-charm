[project]
name = "cover-art"
version = "0.1.0"
description = "Fetch album cover art from iTunes and normalize it to a square size"
readme = "src/cover_art/README.md"
authors = [
    { name = "vupdivup", email = "vnmatt2003@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.83",
    "httpx>=0.28.1",
    "kagglehub>=0.3.13",
    "pillow>=12.3.0",
]

[project.scripts]
cover-art = "cover_art.cli:main"
rym-albums = "rym_albums.cli:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# uv_build's src layout only ships one top-level module by default;
# this repo hosts two independent packages side by side under src/.
module-name = ["cover_art", "rym_albums"]
